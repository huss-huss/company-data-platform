[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "company-data-platform"
version = "0.1.0"
description = "Turns company records from several sources into trusted, deduplicated entities."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Hussen Mohammed" }]
requires-python = ">=3.12,<3.13"
dependencies = [
  "httpx>=0.27",
  "rapidfuzz>=3.9",
  "duckdb>=1.1",
  "dbt-core>=1.9",
  "dbt-duckdb>=1.9",
  "typer>=0.12",
]

[project.optional-dependencies]
orchestration = ["dagster>=1.9", "dagster-dbt>=0.25", "dagster-webserver>=1.9"]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "ruff>=0.6"]

[project.scripts]
cdp = "cdp.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/cdp"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["dbt/target", "dbt/dbt_packages"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = ["e2e: end-to-end pipeline tests (slower, run dbt)"]
